name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  web:
    name: Browser engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Engine tests
        run: node --test "web/tests/*.test.mjs"

      - name: Syntax check the classic scripts
        run: node --check web/engine.js && node --check web/sw.js

      # node --check pre-parses function bodies lazily and lets a malformed
      # literal inside a method through; the browser then refuses the module
      # with no file and no line. This compiles each one eagerly instead.
      - name: Compile the game modules
        run: node --experimental-vm-modules web/tests/parse-modules.mjs
